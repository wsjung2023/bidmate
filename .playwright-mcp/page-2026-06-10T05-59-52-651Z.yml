              - listitem [ref=e341]:
                - generic [ref=e342]: 용도에 대한 검색은 2008년10월 부터 새롭게 추가된 부동산물건의 목록별 용도에 대한 검색을 제공합니다. 단, 2008년10월 이전에 감정평가된 물건은 목록의 용도 미지정으로 인해, 물건의 용도를 검색하여 조회합니다.
